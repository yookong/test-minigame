<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080f27">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>별똥별 피하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one full-screen night-sky canvas under a thin HUD; start, result and shop cards float centered over the field */
:root {
  --sky: #13224a;
  --sky-deep: #080f27;
  --ink: #f4efe4;
  --mute: #a3add0;
  --amber: #ffc45c;
  --coral: #ff6a55;
  --panel: rgba(13, 24, 56, 0.9);
  --tile: rgba(163, 173, 208, 0.08);
  --line: rgba(163, 173, 208, 0.28);
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sky-deep); color: var(--ink); font-family: var(--body);
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#game { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.hud {
  position: absolute; inset: 0 0 auto;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--display); pointer-events: none;
}
.hud .score { font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hud .lv { font-size: 0.95rem; color: var(--mute); margin-top: 4px; }
.hud .right { text-align: right; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.hud .wallet { font-size: 1.25rem; color: var(--amber); }
.hud .best { font-size: 0.95rem; color: var(--mute); }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(8, 15, 39, 0.45);
}
.card {
  width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; touch-action: pan-y;
  display: grid; gap: 14px; text-align: center;
  padding: 26px 20px 22px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.card h1 {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: 2.5rem; line-height: 1.1; color: var(--amber); text-wrap: balance;
}
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.4rem; color: var(--mute); }
.card p { margin: 0; color: var(--mute); line-height: 1.6; font-size: 0.95rem; word-break: keep-all; }
.big { font-family: var(--display); font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { color: var(--mute); font-variant-numeric: tabular-nums; word-break: keep-all; line-height: 1.5; }
.gain { font-family: var(--display); color: var(--amber); font-size: 1.15rem; }
.newbest { color: var(--amber); font-family: var(--display); font-size: 1.15rem; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 16px; font-size: 0.88rem; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.btns { display: grid; gap: 10px; }
button {
  font-family: var(--display); font-size: 1.3rem;
  padding: 13px 20px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--amber); color: var(--sky-deep);
}
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-size: 1.1rem; padding-block: 11px; }
button:disabled { background: var(--tile); color: var(--mute); cursor: default; }
button:active:not(:disabled) { transform: scale(0.97); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* shop */
.shop-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.shop-head h2 { color: var(--amber); font-size: 1.7rem; }
.shop-head .purse { font-family: var(--display); font-size: 1.25rem; color: var(--amber); font-variant-numeric: tabular-nums; }
#preview { width: 100%; height: 104px; border-radius: 16px; background: var(--tile); display: block; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--tile); padding: 4px; border-radius: 999px; }
.tabs button { font-size: 1rem; padding: 8px 6px; background: transparent; color: var(--mute); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--sky-deep); }
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.item {
  display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px;
  border-radius: 14px; background: var(--tile); border: 2px solid transparent; color: var(--ink);
  font-family: var(--body); font-size: 0.85rem;
}
.item canvas { width: 46px; height: 46px; }
.item .nm { font-family: var(--display); font-size: 0.98rem; }
.item .st { font-size: 0.78rem; color: var(--mute); font-variant-numeric: tabular-nums; }
.item .st.price { color: var(--amber); }
.item .st.on { color: var(--ink); }
.item[aria-pressed="true"] { border-color: var(--amber); }
.toast { min-height: 1.2em; margin-block: -4px; font-family: var(--display); color: var(--amber); }
@media (prefers-reduced-motion: reduce) { button:active:not(:disabled) { transform: none; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#080f27}</style>
</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <div class="hud" aria-live="off">
    <div>
      <div class="score" id="score">0</div>
      <div class="lv" id="lv">Lv.1</div>
    </div>
    <div class="right">
      <div class="wallet">★ <span id="wallet">0</span></div>
      <div class="best">최고 <span id="best">0</span></div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <section class="card" id="start">
      <h1>별똥별 피하기</h1>
      <p>화면 아무 곳이나 손가락으로 좌우로 끌어서 떨어지는 운석을 피하세요. 15초마다 레벨이 올라 점점 빨라져요.</p>
      <div class="legend">
        <span><i class="dot" style="background:#ff6a55"></i>보통</span>
        <span><i class="dot" style="background:#4fd8ff"></i>작고 빠름</span>
        <span><i class="dot" style="background:#9b7bff"></i>크고 느림</span>
        <span><i class="dot" style="background:#7be06a"></i>지그재그</span>
      </div>
      <p>하얀 별을 모으면 상점에서 캐릭터를 꾸밀 수 있어요.</p>
      <div class="btns">
        <button id="startBtn" type="button">시작하기</button>
        <button id="shopBtn1" class="ghost" type="button">상점</button>
      </div>
      <p style="font-size:.8rem">PC에서는 ← → 방향키로도 움직일 수 있어요.</p>
    </section>
    <section class="card" id="over" hidden>
      <h2>운석에 맞았어요</h2>
      <div class="big" id="final">0</div>
      <div class="newbest" id="newbest" hidden>새 최고 기록!</div>
      <div class="gain" id="gain"></div>
      <div class="sub" id="overInfo"></div>
      <div class="btns">
        <button id="againBtn" type="button">다시 하기</button>
        <button id="shopBtn2" class="ghost" type="button">상점</button>
      </div>
    </section>
    <section class="card" id="shop" hidden>
      <div class="shop-head">
        <h2>상점</h2>
        <div class="purse">★ <span id="purse">0</span></div>
      </div>
      <canvas id="preview" aria-label="캐릭터 미리보기"></canvas>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="skin" aria-selected="true">색깔</button>
        <button type="button" role="tab" data-tab="hat" aria-selected="false">모자</button>
        <button type="button" role="tab" data-tab="trail" aria-selected="false">꼬리</button>
      </div>
      <div class="items" id="items"></div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="btns">
        <button id="actBtn" type="button">장착중</button>
        <button id="closeShop" class="ghost" type="button">닫기</button>
      </div>
    </section>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = { amber: '#ffc45c', coral: '#ff6a55', ink: '#f4efe4', sky: '#13224a', deep: '#080f27' };

  // ---------- catalog ----------
  const ITEMS = {
    skin: [
      { id: 'sun', name: '햇살', price: 0, color: '#ffc45c' },
      { id: 'mint', name: '민트', price: 8, color: '#6fe3c1' },
      { id: 'peach', name: '복숭아', price: 12, color: '#ffab8c' },
      { id: 'sakura', name: '벚꽃', price: 15, color: '#ffa3c8' },
      { id: 'sky', name: '하늘', price: 20, color: '#8ec5ff' },
      { id: 'lilac', name: '라일락', price: 25, color: '#c7abff' },
      { id: 'snow', name: '눈송이', price: 30, color: '#eef3ff' },
      { id: 'gold', name: '황금', price: 45, color: '#ffd84a' },
      { id: 'rainbow', name: '무지개', price: 60, color: null },
    ],
    hat: [
      { id: 'none', name: '없음', price: 0 },
      { id: 'ribbon', name: '리본', price: 10 },
      { id: 'flower', name: '꽃핀', price: 15 },
      { id: 'party', name: '고깔모자', price: 20 },
      { id: 'crown', name: '왕관', price: 35 },
      { id: 'wizard', name: '마법사 모자', price: 45 },
    ],
    trail: [
      { id: 'none', name: '없음', price: 0 },
      { id: 'sparkle', name: '반짝이', price: 20 },
      { id: 'bubble', name: '비눗방울', price: 25 },
      { id: 'heart', name: '하트', price: 30 },
      { id: 'rainbow', name: '무지개', price: 50 },
    ],
  };
  const findItem = (cat, id) => ITEMS[cat].find((i) => i.id === id) || ITEMS[cat][0];

  // ---------- save data ----------
  const SAVE_KEY = 'meteor-dodge-save-v1';
  let save = { best: 0, stars: 0, owned: ['skin:sun', 'hat:none', 'trail:none'], equip: { skin: 'sun', hat: 'none', trail: 'none' } };
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw) save = { ...save, ...raw, equip: { ...save.equip, ...(raw.equip || {}) } };
    else save.best = Number(localStorage.getItem('meteor-dodge-best')) || 0;
  } catch (e) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
  const owns = (cat, id) => save.owned.includes(cat + ':' + id);

  const scoreEl = $('score'), lvEl = $('lv'), walletEl = $('wallet'), bestEl = $('best');
  const overlay = $('overlay');
  const screens = { start: $('start'), over: $('over'), shop: $('shop') };
  function refreshHud() { walletEl.textContent = save.stars; bestEl.textContent = save.best; }
  refreshHud();

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  };
  let clock = 0;
  const skinColor = (id, time) => id === 'rainbow' ? `hsl(${(time * 90) % 360},90%,72%)` : findItem('skin', id).color;

  function starPath(c, x, y, r, rot, points = 5, inner = 0.45) {
    c.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const rr = i % 2 ? r * inner : r;
      const a = rot + i * Math.PI / points - Math.PI / 2;
      c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath();
  }
  function heartPath(c, x, y, s) {
    y -= s * 0.5;
    c.beginPath();
    c.moveTo(x, y + s * 0.3);
    c.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    c.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    c.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    c.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    c.closePath();
  }

  function drawHat(c, x, y, r, hat) {
    if (hat === 'ribbon') {
      const cx = x + r * 0.45, cy = y - r * 0.8;
      c.fillStyle = '#ff5c8a';
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx - r * 0.6, cy - r * 0.38); c.lineTo(cx - r * 0.55, cy + r * 0.38); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + r * 0.6, cy - r * 0.38); c.lineTo(cx + r * 0.55, cy + r * 0.38); c.closePath(); c.fill();
      c.fillStyle = '#ff8fb0'; c.beginPath(); c.arc(cx, cy, r * 0.17, 0, Math.PI * 2); c.fill();
    } else if (hat === 'flower') {
      const cx = x - r * 0.5, cy = y - r * 0.75;
      c.fillStyle = '#ffffff';
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        c.beginPath(); c.arc(cx + Math.cos(a) * r * 0.24, cy + Math.sin(a) * r * 0.24, r * 0.2, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = '#ffc45c'; c.beginPath(); c.arc(cx, cy, r * 0.16, 0, Math.PI * 2); c.fill();
    } else if (hat === 'party') {
      c.fillStyle = '#4fd8ff';
      c.beginPath(); c.moveTo(x - r * 0.5, y - r * 0.8); c.lineTo(x + r * 0.5, y - r * 0.8); c.lineTo(x + r * 0.12, y - r * 2.05); c.closePath(); c.fill();
      c.fillStyle = '#ff5c8a';
      c.beginPath(); c.arc(x - r * 0.05, y - r * 1.15, r * 0.1, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(x + r * 0.2, y - r * 1.45, r * 0.08, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(x + r * 0.12, y - r * 2.05, r * 0.17, 0, Math.PI * 2); c.fill();
    } else if (hat === 'crown') {
      const b = y - r * 0.72, h = r * 0.75, w = r * 0.62;
      c.fillStyle = '#ffd84a';
      c.beginPath();
      c.moveTo(x - w, b); c.lineTo(x - w, b - h); c.lineTo(x - w * 0.5, b - h * 0.5); c.lineTo(x, b - h * 1.1);
      c.lineTo(x + w * 0.5, b - h * 0.5); c.lineTo(x + w, b - h); c.lineTo(x + w, b); c.closePath(); c.fill();
      c.strokeStyle = '#c9951c'; c.lineWidth = Math.max(1, r * 0.06); c.stroke();
      c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(x, b - h * 0.3, r * 0.11, 0, Math.PI * 2); c.fill();
    } else if (hat === 'wizard') {
      c.fillStyle = '#6b4bd6';
      c.beginPath(); c.ellipse(x, y - r * 0.8, r * 0.95, r * 0.22, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.moveTo(x - r * 0.55, y - r * 0.85); c.lineTo(x + r * 0.55, y - r * 0.85); c.lineTo(x + r * 0.55, y - r * 2.45); c.closePath(); c.fill();
      c.fillStyle = '#ffd84a'; starPath(c, x + r * 0.05, y - r * 1.35, r * 0.2, 0); c.fill();
    }
  }

  function drawHero(c, x, y, r, look, time) {
    const col = skinColor(look.skin, time);
    c.save();
    c.shadowColor = col; c.shadowBlur = r * 1.5;
    c.fillStyle = col;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.restore();
    c.fillStyle = C.deep;
    const ex = r * 0.32, ey = r * 0.12, er = r * 0.13;
    c.beginPath(); c.arc(x - ex, y - ey, er, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x + ex, y - ey, er, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,92,138,0.35)';
    c.beginPath(); c.ellipse(x - r * 0.55, y + r * 0.2, r * 0.17, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + r * 0.55, y + r * 0.2, r * 0.17, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    drawHat(c, x, y, r, look.hat);
  }

  // trail particles: shared by the game and the shop preview
  function emitTrail(list, kind, x, y, r, scale, time) {
    if (kind === 'none') return;
    const p = { x: x + rand(-r * 0.5, r * 0.5), y: y + r * 0.6, vx: rand(-20, 20) * scale, vy: rand(70, 130) * scale, life: 0.7, max: 0.7, kind, s: r };
    if (kind === 'rainbow') { p.x = x; p.y = y + r * 0.3; p.vx = 0; p.vy = 170 * scale; p.life = p.max = 0.45; p.hue = (time * 240) % 360; }
    if (kind === 'bubble') { p.vy *= 0.6; p.life = p.max = 1; }
    list.push(p);
  }
  function drawTrail(c, list) {
    for (const p of list) {
      const k = clamp(p.life / p.max, 0, 1);
      c.globalAlpha = k;
      if (p.kind === 'sparkle') {
        c.fillStyle = Math.random() < 0.5 ? '#fff6c8' : '#ffffff';
        starPath(c, p.x, p.y, p.s * 0.28, 0, 4, 0.35); c.fill();
      } else if (p.kind === 'heart') {
        c.fillStyle = '#ff7aa8'; heartPath(c, p.x, p.y, p.s * 0.55); c.fill();
      } else if (p.kind === 'bubble') {
        c.strokeStyle = '#bfe8ff'; c.lineWidth = Math.max(1, p.s * 0.07);
        c.beginPath(); c.arc(p.x, p.y, p.s * (0.15 + (1 - k) * 0.3), 0, Math.PI * 2); c.stroke();
      } else if (p.kind === 'rainbow') {
        c.fillStyle = `hsl(${p.hue},90%,65%)`;
        c.beginPath(); c.arc(p.x, p.y, p.s * 0.7 * k, 0, Math.PI * 2); c.fill();
      }
    }
    c.globalAlpha = 1;
  }
  function stepTrail(list, dt) {
    for (const p of list) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    return list.filter((p) => p.life > 0);
  }

  // ---------- meteors ----------
  const ROCKS = {
    normal: { colors: ['#ff6a55', '#ff9a3c', '#ff5c8a'], size: [12, 20], speed: 1 },
    small: { colors: ['#4fd8ff'], size: [7, 10], speed: 1.45 },
    big: { colors: ['#9b7bff'], size: [26, 34], speed: 0.68 },
    zigzag: { colors: ['#7be06a'], size: [12, 16], speed: 0.95 },
  };
  function pickRockType(t) {
    const w = { normal: 6, small: t > 8 ? 2 + t / 20 : 0, big: t > 15 ? 1.5 + t / 40 : 0, zigzag: t > 30 ? 1.5 + t / 30 : 0 };
    let total = 0; for (const k in w) total += w[k];
    let roll = Math.random() * total;
    for (const k in w) { roll -= w[k]; if (roll <= 0) return k; }
    return 'normal';
  }

  // ---------- game state ----------
  let W = 0, H = 0, unit = 1;
  let state = 'ready'; // ready | play | dying | over
  let t = 0, bonus = 0, score = 0, spawnT = 0, starT = 3, dyingT = 0, runStars = 0, level = 1, banner = 0, trailT = 0;
  let rocks = [], stars = [], sparks = [], sky = [], trail = [];
  const player = { x: 0, y: 0, r: 14 };

  function resize() {
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    unit = clamp(Math.min(W, H * 0.6) / 400, 0.8, 1.6);
    player.r = 14 * unit;
    player.y = H - Math.max(80, H * 0.14);
    player.x = player.x ? clamp(player.x, player.r, W - player.r) : W / 2;
    sky = Array.from({ length: Math.round(W * H / 5000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, s: rand(0.4, 1.6), v: rand(6, 22)
    }));
    if (!screens.shop.hidden) sizePreview();
  }

  function start() {
    t = 0; bonus = 0; score = 0; spawnT = 0.6; starT = rand(2.5, 4); runStars = 0; level = 1; banner = 0;
    rocks = []; stars = []; sparks = []; trail = [];
    player.x = W / 2;
    state = 'play';
    overlay.hidden = true;
    scoreEl.textContent = '0'; lvEl.textContent = 'Lv.1';
  }

  function die() {
    state = 'dying'; dyingT = 0.8;
    const col = skinColor(save.equip.skin, clock);
    for (let i = 0; i < 36; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 320) * unit;
      sparks.push({ x: player.x, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.5, 1), max: 1,
        c: Math.random() < 0.6 ? col : C.coral });
    }
    try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
  }

  let returnTo = 'start';
  function show(name) {
    for (const k in screens) screens[k].hidden = k !== name;
    overlay.hidden = false;
    if (name === 'shop') openShop();
  }

  function showOver() {
    state = 'over';
    const isNew = score > save.best;
    if (isNew) save.best = score;
    persist(); refreshHud();
    $('final').textContent = score;
    $('newbest').hidden = !isNew;
    $('gain').textContent = runStars ? `별 ${runStars}개 획득 · 보유 ★${save.stars}` : `보유 ★${save.stars}`;
    $('overInfo').textContent = `버틴 시간 ${t.toFixed(1)}초 · Lv.${level} · 최고 ${save.best}`;
    show('over');
    $('againBtn').focus({ preventScroll: true });
  }

  // ---------- input ----------
  let dragId = null, lastX = 0;
  const keys = { left: false, right: false };
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    dragId = e.pointerId; lastX = e.clientX;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerId !== dragId || state !== 'play') return;
    player.x = clamp(player.x + (e.clientX - lastX) * 1.25, player.r, W - player.r);
    lastX = e.clientX;
  });
  const endDrag = (e) => { if (e.pointerId === dragId) dragId = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  });
  addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('shopBtn1').addEventListener('click', () => { returnTo = 'start'; show('shop'); });
  $('shopBtn2').addEventListener('click', () => { returnTo = 'over'; show('shop'); });
  $('closeShop').addEventListener('click', () => show(returnTo));
  addEventListener('resize', resize);
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // ---------- update ----------
  function spawnRock() {
    const type = pickRockType(t), def = ROCKS[type];
    const r = rand(def.size[0], def.size[1]) * unit;
    const base = Math.min(170 + t * 6 + t * t * 0.02, 950);
    const speed = base * def.speed * rand(0.85, 1.2) * unit;
    const drift = t > 45 && type !== 'zigzag' && Math.random() < 0.3 ? rand(-90, 90) : rand(-20, 20);
    rocks.push({
      type, x: rand(r, W - r), y: -r - 10, r, vx: drift * unit, vy: speed, spin: rand(0, 6),
      color: def.colors[Math.floor(Math.random() * def.colors.length)],
      phase: rand(0, 6), amp: type === 'zigzag' ? rand(60, 110) * unit : 0,
    });
  }

  function update(dt) {
    clock += dt;
    for (const s of sky) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }

    if (state === 'play') {
      t += dt;
      if (keys.left) player.x -= 420 * unit * dt;
      if (keys.right) player.x += 420 * unit * dt;
      player.x = clamp(player.x, player.r, W - player.r);

      const lv = 1 + Math.floor(t / 15);
      if (lv !== level) { level = lv; banner = 1.6; lvEl.textContent = 'Lv.' + level; }

      spawnT -= dt;
      if (spawnT <= 0) {
        spawnRock();
        const extra = t > 20 ? Math.min(0.6, (t - 20) / 80) : 0;
        if (Math.random() < extra) spawnRock();
        if (t > 60 && Math.random() < Math.min(0.4, (t - 60) / 100)) spawnRock();
        spawnT = Math.max(0.1, 0.7 * Math.pow(0.985, t)) * (W > 600 ? 0.75 : 1);
      }
      starT -= dt;
      if (starT <= 0) {
        stars.push({ x: rand(20, W - 20), y: -20, r: 11 * unit, vy: (150 + t * 1.5) * unit, a: 0 });
        starT = rand(3, 5.5);
      }
      trailT -= dt;
      if (trailT <= 0) { emitTrail(trail, save.equip.trail, player.x, player.y, player.r, unit, clock); trailT = 1 / 40; }
    }
    if (banner > 0) banner -= dt;

    for (const m of rocks) {
      m.y += m.vy * dt; m.spin += dt * 2;
      if (m.type === 'zigzag') { m.phase += dt * 3; m.x += Math.cos(m.phase) * m.amp * dt * 3; }
      else m.x += m.vx * dt;
      if (m.x < m.r || m.x > W - m.r) { m.vx = -m.vx; m.x = clamp(m.x, m.r, W - m.r); }
    }
    rocks = rocks.filter((m) => m.y - m.r < H + 40);
    for (const s of stars) { s.y += s.vy * dt; s.a += dt * 3; }
    stars = stars.filter((s) => s.y - s.r < H + 40);

    if (state === 'play') {
      for (const m of rocks) {
        if (Math.hypot(m.x - player.x, m.y - player.y) < (m.r + player.r) * 0.78) { die(); break; }
      }
      for (const s of stars) {
        if (!s.got && Math.hypot(s.x - player.x, s.y - player.y) < s.r + player.r) {
          s.got = true; bonus += 50; runStars++; save.stars++;
          walletEl.textContent = save.stars;
          for (let i = 0; i < 12; i++) {
            const a = rand(0, Math.PI * 2), sp = rand(40, 160) * unit;
            sparks.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5, max: 0.5, c: C.ink });
          }
          try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
        }
      }
      stars = stars.filter((s) => !s.got);
      score = Math.floor(t * 10) + bonus;
      scoreEl.textContent = score;
    }

    trail = stepTrail(trail, dt);
    for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
    sparks = sparks.filter((p) => p.life > 0);

    if (state === 'dying') { dyingT -= dt; if (dyingT <= 0) showOver(); }
  }

  // ---------- draw ----------
  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C.deep); g.addColorStop(1, C.sky);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(244,239,228,0.55)';
    for (const s of sky) ctx.fillRect(s.x, s.y, s.s, s.s);

    for (const s of stars) {
      const pulse = reduceMotion ? 1 : 1 + Math.sin(s.a * 2) * 0.12;
      ctx.save();
      ctx.shadowColor = C.ink; ctx.shadowBlur = 14; ctx.fillStyle = C.ink;
      starPath(ctx, s.x, s.y, s.r * pulse, s.a * 0.4); ctx.fill();
      ctx.restore();
    }

    for (const m of rocks) {
      const vx = m.type === 'zigzag' ? Math.cos(m.phase) * m.amp * 3 : m.vx;
      const sp = Math.hypot(vx, m.vy), len = m.r * 4.5;
      const nx = -vx / sp, ny = -m.vy / sp;
      const tail = ctx.createLinearGradient(m.x, m.y, m.x + nx * len, m.y + ny * len);
      tail.addColorStop(0, rgba(m.color, 0.55)); tail.addColorStop(1, rgba(m.color, 0));
      ctx.strokeStyle = tail; ctx.lineWidth = m.r * 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + nx * len, m.y + ny * len); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(8,15,39,0.28)';
      ctx.beginPath(); ctx.arc(m.x + Math.cos(m.spin) * m.r * 0.35, m.y + Math.sin(m.spin) * m.r * 0.35, m.r * 0.28, 0, Math.PI * 2); ctx.fill();
    }

    drawTrail(ctx, trail);
    if (state === 'play' || state === 'ready') drawHero(ctx, player.x, player.y, player.r, save.equip, clock);

    for (const p of sparks) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6 * unit, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (banner > 0 && state === 'play') {
      ctx.globalAlpha = clamp(banner, 0, 1);
      ctx.fillStyle = C.amber; ctx.textAlign = 'center';
      ctx.font = `${Math.round(30 * unit)}px Jua, "Apple SD Gothic Neo", sans-serif`;
      ctx.fillText(`Lv.${level} 속도 UP!`, W / 2, H * 0.36);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- shop ----------
  const pv = $('preview'), pctx = pv.getContext('2d');
  let pW = 0, pH = 0, pTrail = [], pTrailT = 0;
  let tab = 'skin', picked = null; // picked = id in current tab being previewed
  const previewLook = () => ({ ...save.equip, ...(picked ? { [tab]: picked } : {}) });

  function sizePreview() {
    const r = pv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    pW = r.width; pH = r.height;
    pv.width = Math.round(pW * dpr); pv.height = Math.round(pH * dpr);
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawPreview(dt) {
    if (screens.shop.hidden || overlay.hidden || !pW) return;
    const look = previewLook();
    const r = 26, x = pW / 2 + (reduceMotion ? 0 : Math.sin(clock * 1.6) * 40), y = pH * 0.5;
    pTrailT -= dt;
    if (pTrailT <= 0) { emitTrail(pTrail, look.trail, x, y, r, 0.8, clock); pTrailT = 1 / 40; }
    pTrail = stepTrail(pTrail, dt);
    pctx.clearRect(0, 0, pW, pH);
    drawTrail(pctx, pTrail);
    drawHero(pctx, x, y, r, look, clock);
  }

  function itemIcon(cat, item) {
    const c = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = c.height = 46 * dpr;
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cat === 'trail') {
      const list = [];
      if (item.id !== 'none') {
        for (let i = 0; i < 7; i++) {
          const k = i / 6;
          list.push({ kind: item.id, x: 23 + Math.sin(i * 1.3) * 8, y: 10 + k * 30, s: 14, life: 1 - k * 0.7, max: 1, hue: i * 50 });
        }
        drawTrail(g, list);
      } else {
        g.strokeStyle = 'rgba(163,173,208,0.6)'; g.lineWidth = 2;
        g.beginPath(); g.arc(23, 23, 12, 0, Math.PI * 2); g.moveTo(15, 31); g.lineTo(31, 15); g.stroke();
      }
    } else {
      const look = { skin: cat === 'skin' ? item.id : save.equip.skin, hat: cat === 'hat' ? item.id : 'none', trail: 'none' };
      drawHero(g, 23, cat === 'hat' ? 30 : 23, cat === 'hat' ? 12 : 14, look, 0);
    }
    return c;
  }

  function renderItems() {
    const box = $('items');
    box.textContent = '';
    for (const it of ITEMS[tab]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'item';
      b.setAttribute('aria-pressed', String(it.id === (picked || save.equip[tab])));
      b.appendChild(itemIcon(tab, it));
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.name; b.appendChild(nm);
      const st = document.createElement('span'); st.className = 'st';
      if (save.equip[tab] === it.id) { st.textContent = '장착중'; st.classList.add('on'); }
      else if (owns(tab, it.id)) st.textContent = '보유';
      else { st.textContent = '★ ' + it.price; st.classList.add('price'); }
      b.appendChild(st);
      b.addEventListener('click', () => { picked = it.id; $('toast').textContent = ''; renderShop(); });
      box.appendChild(b);
    }
  }

  function renderShop() {
    $('purse').textContent = save.stars;
    for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    renderItems();
    const id = picked || save.equip[tab], it = findItem(tab, id), act = $('actBtn');
    if (save.equip[tab] === id) { act.textContent = '장착중'; act.disabled = true; }
    else if (owns(tab, id)) { act.textContent = '장착하기'; act.disabled = false; }
    else if (save.stars >= it.price) { act.textContent = `★${it.price}로 사기`; act.disabled = false; }
    else { act.textContent = `별이 ${it.price - save.stars}개 더 필요해요`; act.disabled = true; }
  }

  $('actBtn').addEventListener('click', () => {
    const id = picked || save.equip[tab], it = findItem(tab, id);
    if (!owns(tab, id)) {
      if (save.stars < it.price) return;
      save.stars -= it.price; save.owned.push(tab + ':' + id);
      $('toast').textContent = `${it.name}을(를) 샀어요!`;
      try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    } else {
      $('toast').textContent = `${it.name} 장착!`;
    }
    save.equip[tab] = id; picked = null;
    persist(); refreshHud(); renderShop();
  });
  for (const b of document.querySelectorAll('.tabs button')) {
    b.addEventListener('click', () => { tab = b.dataset.tab; picked = null; $('toast').textContent = ''; renderShop(); });
  }

  function openShop() {
    picked = null; pTrail = []; $('toast').textContent = '';
    renderShop();
    requestAnimationFrame(sizePreview);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    drawPreview(dt);
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
