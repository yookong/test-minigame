<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080f27">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>별똥별 피하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one full-screen sky canvas under a thin HUD; menu, result, shop, achievement and pause cards float centered over the field */
:root {
  --sky: #13224a;
  --sky-deep: #080f27;
  --ink: #f4efe4;
  --mute: #a3add0;
  --amber: #ffc45c;
  --coral: #ff6a55;
  --ok: #7be06a;
  --panel: rgba(13, 24, 56, 0.92);
  --tile: rgba(163, 173, 208, 0.08);
  --line: rgba(163, 173, 208, 0.28);
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sky-deep); color: var(--ink); font-family: var(--body);
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#game { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.hud {
  position: absolute; inset: 0 0 auto;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--display); pointer-events: none;
}
.hud .score { font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hud .lv { font-size: 0.95rem; color: var(--mute); margin-top: 4px; }
.hud .right { text-align: right; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.hud .wallet { font-size: 1.25rem; color: var(--amber); }
.hud .best { font-size: 0.95rem; color: var(--mute); }
#pauseBtn {
  pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%;
  background: rgba(244, 239, 228, 0.12); color: var(--ink); font-size: 1rem; letter-spacing: 1px;
}
.note {
  position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--amber); color: var(--amber);
  font-family: var(--display); font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none; z-index: 5;
}
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(8, 15, 39, 0.45);
}
.card {
  width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; touch-action: pan-y;
  display: grid; gap: 12px; text-align: center;
  padding: 24px 18px 20px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.card h1 {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: 2.5rem; line-height: 1.1; color: var(--amber); text-wrap: balance;
}
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.4rem; color: var(--mute); }
.card p { margin: 0; color: var(--mute); line-height: 1.6; font-size: 0.93rem; word-break: keep-all; }
.titletag {
  justify-self: center; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line);
  font-family: var(--display); font-size: 0.95rem; color: var(--ink);
}
.big { font-family: var(--display); font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { color: var(--mute); font-variant-numeric: tabular-nums; word-break: keep-all; line-height: 1.5; }
.gain { font-family: var(--display); color: var(--amber); font-size: 1.15rem; }
.newbest { color: var(--amber); font-family: var(--display); font-size: 1.15rem; }
.newach { display: grid; gap: 4px; font-size: 0.9rem; color: var(--ok); font-family: var(--display); }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.btns { display: grid; gap: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button {
  font-family: var(--display); font-size: 1.3rem;
  padding: 13px 20px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--amber); color: var(--sky-deep);
}
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-size: 1.1rem; padding-block: 11px; }
button.toggle { background: transparent; color: var(--mute); border: 1px solid var(--line); font-size: 0.95rem; padding: 9px 10px; }
button.toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
button:disabled { background: var(--tile); color: var(--mute); cursor: default; }
button:active:not(:disabled) { transform: scale(0.97); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* shop */
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-head h2 { color: var(--amber); font-size: 1.7rem; }
.card-head .purse { font-family: var(--display); font-size: 1.25rem; color: var(--amber); font-variant-numeric: tabular-nums; }
#preview { width: 100%; height: 104px; border-radius: 16px; background: var(--tile); display: block; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--tile); padding: 4px; border-radius: 999px; }
.tabs button { font-size: 0.92rem; padding: 8px 2px; background: transparent; color: var(--mute); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--sky-deep); }
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.item {
  display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px;
  border-radius: 14px; background: var(--tile); border: 2px solid transparent; color: var(--ink);
  font-family: var(--body); font-size: 0.85rem;
}
.item canvas { width: 46px; height: 46px; }
.item .nm { font-family: var(--display); font-size: 0.98rem; }
.item .st { font-size: 0.78rem; color: var(--mute); font-variant-numeric: tabular-nums; }
.item .st.price { color: var(--amber); }
.item .st.on { color: var(--ink); }
.item[aria-pressed="true"] { border-color: var(--amber); }
.toast { min-height: 1.2em; margin-block: -4px; font-family: var(--display); color: var(--amber); }

/* achievements */
.achcount { font-family: var(--display); color: var(--mute); font-size: 1.05rem; }
.achlist { display: grid; gap: 8px; text-align: left; }
.ach {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px 10px 10px 12px; border-radius: 14px; background: var(--tile); border: 2px solid transparent;
}
.ach.done { border-color: rgba(123, 224, 106, 0.35); }
.ach .ic { font-family: var(--display); font-size: 1.2rem; text-align: center; color: var(--mute); }
.ach.done .ic { color: var(--ok); }
.ach .nm { font-family: var(--display); font-size: 1.02rem; }
.ach .ds { font-size: 0.8rem; color: var(--mute); line-height: 1.4; word-break: keep-all; }
.ach .tt { font-size: 0.78rem; color: var(--amber); }
.ach .side { display: grid; justify-items: end; gap: 4px; font-size: 0.8rem; color: var(--mute); font-variant-numeric: tabular-nums; }
.ach .side button { font-size: 0.85rem; padding: 6px 10px; }
.ach .side button.using { background: var(--ink); }
/* ranking */
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row3 button { padding-inline: 6px; }
.rankbox { display: grid; gap: 8px; padding: 12px; border-radius: 16px; background: var(--tile); }
.rankbox .msg { font-family: var(--display); font-size: 1.05rem; color: var(--ink); word-break: keep-all; }
.rankbox .msg.err { color: var(--mute); font-family: var(--body); font-size: 0.85rem; line-height: 1.5; }
.nickrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.nickrow input {
  min-width: 0; font: 16px var(--body); color: var(--ink); background: rgba(8, 15, 39, 0.6);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px;
  -webkit-user-select: text; user-select: text; touch-action: manipulation;
}
.nickrow input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.nickrow button { font-size: 1rem; padding: 10px 16px; }
.ranklist { display: grid; gap: 6px; text-align: left; }
.rk {
  display: grid; grid-template-columns: 30px 40px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 8px 12px 8px 8px; border-radius: 14px; background: var(--tile);
}
.rk.me { border: 2px solid var(--amber); }
.rk .no { font-family: var(--display); font-size: 1.2rem; text-align: center; color: var(--mute); font-variant-numeric: tabular-nums; }
.rk:nth-child(1) .no { color: #ffd84a; } .rk:nth-child(2) .no { color: #dfe6f5; } .rk:nth-child(3) .no { color: #e8a374; }
.rk canvas { width: 40px; height: 40px; }
.rk .who { min-width: 0; }
.rk .nm { font-family: var(--display); font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .tt { font-size: 0.76rem; color: var(--amber); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .sc { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; text-align: right; }
.rk .sc small { display: block; font-family: var(--body); font-size: 0.72rem; color: var(--mute); }
.rankstate { color: var(--mute); padding: 16px 0; font-size: 0.95rem; word-break: keep-all; }
.myrank { font-family: var(--display); color: var(--amber); font-size: 1.05rem; }
@media (prefers-reduced-motion: reduce) { button:active:not(:disabled) { transform: none; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#080f27}</style>
</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <div class="hud" aria-live="off">
    <div>
      <div class="score" id="score">0</div>
      <div class="lv" id="lv">Lv.1</div>
    </div>
    <button id="pauseBtn" type="button" aria-label="일시정지" hidden>❚❚</button>
    <div class="right">
      <div class="wallet">★ <span id="wallet">0</span></div>
      <div class="best">최고 <span id="best">0</span></div>
    </div>
  </div>
  <div class="note" id="note" role="status" hidden></div>
  <div class="overlay" id="overlay">
    <section class="card" id="start">
      <h1>별똥별 피하기</h1>
      <div class="titletag" data-title hidden></div>
      <p>화면 아무 곳이나 손가락으로 좌우로 끌어서 떨어지는 운석을 피하세요. 15초마다 레벨이 오르고, 5레벨마다 운석 폭풍이 몰려와요.</p>
      <div class="legend">
        <span><i class="dot" style="background:#ff6a55"></i>보통</span>
        <span><i class="dot" style="background:#4fd8ff"></i>작고 빠름</span>
        <span><i class="dot" style="background:#9b7bff"></i>크고 느림</span>
        <span><i class="dot" style="background:#7be06a"></i>지그재그</span>
      </div>
      <div class="btns">
        <button id="startBtn" type="button">시작하기</button>
        <div class="row3">
          <button class="ghost" type="button" data-open="shop">상점</button>
          <button class="ghost" type="button" data-open="ach">업적</button>
          <button class="ghost" type="button" data-open="rank">랭킹</button>
        </div>
        <div class="row2">
          <button class="toggle" type="button" data-setting="sfx">효과음</button>
          <button class="toggle" type="button" data-setting="music">배경음</button>
        </div>
      </div>
      <p style="font-size:.8rem">PC에서는 ← → 키로 움직이고 P 키로 멈춰요.</p>
    </section>
    <section class="card" id="over" hidden>
      <h2 id="overHead">운석에 맞았어요</h2>
      <div class="big" id="final">0</div>
      <div class="newbest" id="newbest" hidden>새 최고 기록!</div>
      <div class="gain" id="gain"></div>
      <div class="sub" id="overInfo"></div>
      <div class="newach" id="newAch" hidden></div>
      <div class="rankbox" id="rankBox" hidden>
        <div class="msg" id="rankMsg"></div>
        <form class="nickrow" id="nickForm" hidden>
          <input id="nickInput" type="text" maxlength="12" placeholder="닉네임 (12자까지)" autocomplete="nickname" enterkeyhint="done" aria-label="랭킹에 쓸 닉네임">
          <button type="submit">등록</button>
        </form>
      </div>
      <div class="btns">
        <button id="againBtn" type="button">다시 하기</button>
        <div class="row3">
          <button class="ghost" type="button" data-open="shop">상점</button>
          <button class="ghost" type="button" data-open="ach">업적</button>
          <button class="ghost" type="button" data-open="rank">랭킹</button>
        </div>
      </div>
    </section>
    <section class="card" id="rank" hidden>
      <div class="card-head">
        <h2>랭킹</h2>
        <div class="achcount" id="rankPlayers"></div>
      </div>
      <div class="myrank" id="myRank" hidden></div>
      <div class="ranklist" id="rankList"></div>
      <div class="rankstate" id="rankState" hidden></div>
      <form class="nickrow" id="nickForm2">
        <input id="nickInput2" type="text" maxlength="12" placeholder="닉네임 (12자까지)" autocomplete="nickname" enterkeyhint="done" aria-label="닉네임">
        <button type="submit">저장</button>
      </form>
      <button class="ghost" type="button" data-back>닫기</button>
    </section>
    <section class="card" id="pause" hidden>
      <h2 style="color:var(--amber);font-size:1.8rem">일시정지</h2>
      <p id="pauseInfo"></p>
      <div class="btns">
        <button id="resumeBtn" type="button">계속하기</button>
        <div class="row2">
          <button class="toggle" type="button" data-setting="sfx">효과음</button>
          <button class="toggle" type="button" data-setting="music">배경음</button>
        </div>
        <button id="quitBtn" class="ghost" type="button">그만하고 기록 보기</button>
      </div>
    </section>
    <section class="card" id="shop" hidden>
      <div class="card-head">
        <h2>상점</h2>
        <div class="purse">★ <span id="purse">0</span></div>
      </div>
      <canvas id="preview" aria-label="캐릭터 미리보기"></canvas>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="items" id="items"></div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="btns">
        <button id="actBtn" type="button">장착중</button>
        <button class="ghost" type="button" data-back>닫기</button>
      </div>
    </section>
    <section class="card" id="ach" hidden>
      <div class="card-head">
        <h2>업적</h2>
        <div class="achcount" id="achCount"></div>
      </div>
      <p>업적을 달성하면 별을 받고, 칭호를 이름표처럼 달 수 있어요.</p>
      <div class="achlist" id="achList"></div>
      <button class="ghost" type="button" data-back>닫기</button>
    </section>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = { amber: '#ffc45c', coral: '#ff6a55', ink: '#f4efe4', deep: '#080f27', boss: '#ff3d5e' };

  // ================= catalog =================
  const TABS = [['skin', '색깔'], ['hat', '모자'], ['face', '표정'], ['trail', '꼬리'], ['bg', '배경']];
  const ITEMS = {
    skin: [
      { id: 'sun', name: '햇살', price: 0, color: '#ffc45c' },
      { id: 'mint', name: '민트', price: 8, color: '#6fe3c1' },
      { id: 'peach', name: '복숭아', price: 12, color: '#ffab8c' },
      { id: 'sakura', name: '벚꽃', price: 15, color: '#ffa3c8' },
      { id: 'sky', name: '하늘', price: 20, color: '#8ec5ff' },
      { id: 'lilac', name: '라일락', price: 25, color: '#c7abff' },
      { id: 'snow', name: '눈송이', price: 30, color: '#eef3ff' },
      { id: 'gold', name: '황금', price: 45, color: '#ffd84a' },
      { id: 'rainbow', name: '무지개', price: 60, color: null },
    ],
    hat: [
      { id: 'none', name: '없음', price: 0 },
      { id: 'ribbon', name: '리본', price: 10 },
      { id: 'flower', name: '꽃핀', price: 15 },
      { id: 'party', name: '고깔모자', price: 20 },
      { id: 'crown', name: '왕관', price: 35 },
      { id: 'wizard', name: '마법사 모자', price: 45 },
    ],
    face: [
      { id: 'basic', name: '기본', price: 0 },
      { id: 'smile', name: '방긋', price: 8 },
      { id: 'wink', name: '윙크', price: 12 },
      { id: 'wow', name: '깜짝', price: 12 },
      { id: 'cat', name: '고양이', price: 20 },
      { id: 'shades', name: '선글라스', price: 30 },
    ],
    trail: [
      { id: 'none', name: '없음', price: 0 },
      { id: 'sparkle', name: '반짝이', price: 20 },
      { id: 'bubble', name: '비눗방울', price: 25 },
      { id: 'heart', name: '하트', price: 30 },
      { id: 'rainbow', name: '무지개', price: 50 },
    ],
    bg: [
      { id: 'night', name: '밤하늘', price: 0 },
      { id: 'dusk', name: '노을', price: 20 },
      { id: 'deepsea', name: '깊은 바다', price: 30 },
      { id: 'nebula', name: '성운', price: 35 },
      { id: 'aurora', name: '오로라', price: 40 },
    ],
  };
  const findItem = (cat, id) => ITEMS[cat].find((i) => i.id === id) || ITEMS[cat][0];

  const ACH = [
    { id: 'first', name: '첫 비행', desc: '게임을 한 판 끝내기', title: '새내기 별', reward: 2, test: (r, s) => s.runs >= 1 },
    { id: 't30', name: '버티기', desc: '한 판에 30초 버티기', title: '끈기 있는 별', reward: 3, test: (r) => r.time >= 30 },
    { id: 't60', name: '곡예 비행', desc: '한 판에 60초 버티기', title: '운석 곡예사', reward: 5, test: (r) => r.time >= 60 },
    { id: 't120', name: '불멸', desc: '한 판에 120초 버티기', title: '불사조', reward: 12, test: (r) => r.time >= 120 },
    { id: 's1000', name: '천 점', desc: '한 판에 1,000점 넘기기', title: '천점 돌파', reward: 3, test: (r) => r.score >= 1000 },
    { id: 's3000', name: '삼천 점', desc: '한 판에 3,000점 넘기기', title: '고득점 사냥꾼', reward: 8, test: (r) => r.score >= 3000 },
    { id: 'rs5', name: '별 줍기', desc: '한 판에 별 5개 모으기', title: '별 수집가', reward: 3, test: (r) => r.stars >= 5 },

    function init() {

    const SFX = {
      star: () => seq([84, 91], 0.06, 0.14, 'sine', 0.25),
      hit: () => { const t = ac.currentTime; noise(t, 0.5, 0.7, 900, sfxG); tone(170, t, 0.55, 'sine', 0.5, sfxG, 40); },
      level: () => seq([72, 76, 79, 84], 0.07, 0.16, 'triangle', 0.22),

      clear: () => seq([67, 72, 76, 79, 84], 0.09, 0.28, 'triangle', 0.25),
      buy: () => seq([88, 93], 0.08, 0.2, 'square', 0.1),

    const SONGS = {
      normal: { bpm: 116, chords: [[45, [57, 60, 64]], [41, [57, 60, 65]], [48, [60, 64, 67]], [43, [59, 62, 67]]] },
      boss: { bpm: 152, chords: [[45, [57, 60, 64]], [45, [57, 60, 64]], [41, [57, 60, 65]], [40, [56, 59, 64]]] },
    };
    const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
    function schedule() {
      if (!ac || mode === 'off') return;
      const song = SONGS[mode], sd = 60 / song.bpm / 2;
      if (nextT < ac.currentTime) nextT = ac.currentTime + 0.02;

  // ================= backgrounds =================
  const BGS = {

  function makeDots(w, h, n) {
    return Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, s: rand(0.4, 1.6), v: rand(6, 22) }));
  }
  function stepDots(dots, dt, w, h, bg) {
    const up = bg === 'deepsea';
    for (const s of dots) {
      s.y += (up ? -s.v * 1.4 : s.v) * dt;
      if (!up && s.y > h) { s.y = -2; s.x = Math.random() * w; }
      if (up && s.y < -4) { s.y = h + 2; s.x = Math.random() * w; }

  function drawBg(c, w, h, bg, time, dots) {
    const [top, bot] = BGS[bg] || BGS.night;
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    c.fillStyle = g; c.fillRect(0, 0, w, h);

      for (const [bx, by, col] of blobs) {

  // ================= character =================
  function drawHat(c, x, y, r, hat) {
    if (hat === 'ribbon') {
      const cx = x + r * 0.45, cy = y - r * 0.8;
      c.fillStyle = '#ff5c8a';
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx - r * 0.6, cy - r * 0.38); c.lineTo(cx - r * 0.55, cy + r * 0.38); c.closePath(); c.fill();

      const cx = x - r * 0.5, cy = y - r * 0.75;

      c.beginPath(); c.arc(x + r * 0.2, y - r * 1.45, r * 0.08, 0, Math.PI * 2); c.fill();

  function drawFace(c, x, y, r, face) {
    const ex = r * 0.32, ey = y - r * 0.12, er = r * 0.13;
    c.fillStyle = C.deep; c.strokeStyle = C.deep;
    c.lineWidth = Math.max(1.2, r * 0.09); c.lineCap = 'round';

      c.strokeStyle = C.deep; c.lineWidth = Math.max(1.2, r * 0.09);

  function emitTrail(list, kind, x, y, r, scale, time) {

  // ================= update =================
  function spawnRock() {
    const type = pickRockType(t), def = ROCKS[type];
    const r = rand(def.size[0], def.size[1]) * unit;
    const base = Math.min(170 + t * 6 + t * t * 0.02, 950);
    const speed = base * def.speed * rand(0.85, 1.2) * unit;
    const drift = t > 45 && type !== 'zigzag' && Math.random() < 0.3 ? rand(-90, 90) : rand(-20, 20);
    rocks.push({
      type, x: rand(r, W - r), y: -r - 10, r, vx: drift * unit, vy: speed, spin: rand(0, 6),
      color: def.colors[Math.floor(Math.random() * def.colors.length)],
      phase: rand(0, 6), amp: type === 'zigzag' ? rand(60, 110) * unit : 0,
    });
  }

  function update(dt) {
    clock += dt;
    if (state === 'paused') return;
    stepDots(dots, dt, W, H, save.equip.bg);
    if (banner.t > 0) banner.t -= dt;

    if (state === 'countdown') {
      const before = Math.ceil(countdown);
      countdown -= dt;
      if (countdown <= 0) { state = 'play'; Sound.play('go'); Sound.music(boss ? 'boss' : 'normal'); }
      else if (Math.ceil(countdown) !== before) Sound.play('tick');
      return;
    }

    if (state === 'play') {
      t += dt;
      if (keys.left) player.x -= 420 * unit * dt;
      if (keys.right) player.x += 420 * unit * dt;
      player.x = clamp(player.x, player.r, W - player.r);

      const lv = 1 + Math.floor(t / 15);
      if (lv !== level) {
        level = lv; lvEl.textContent = 'Lv.' + level;
        if (level % 5 === 0 && !boss) startBoss();
        else { showBanner(`Lv.${level} 속도 UP!`); Sound.play('level'); }
      }

      if (boss) updateBoss(dt);
      else {
        spawnT -= dt;
        if (spawnT <= 0) {
          spawnRock();
          const extra = t > 20 ? Math.min(0.6, (t - 20) / 80) : 0;
          if (Math.random() < extra) spawnRock();
          if (t > 60 && Math.random() < Math.min(0.4, (t - 60) / 100)) spawnRock();
          spawnT = Math.max(0.1, 0.7 * Math.pow(0.985, t)) * (W > 600 ? 0.75 : 1);
        }
        starT -= dt;
        if (starT <= 0) {

    }

    for (const m of rocks) {
      m.y += m.vy * dt; m.spin += dt * 2;

      else m.x += m.vx * dt;
      if (m.x < m.r || m.x > W - m.r) { if (m.type !== 'boss') m.vx = -m.vx; m.x = clamp(m.x, m.r, W - m.r); }
    }
    const before = rocks.length;
    rocks = rocks.filter((m) => m.y - m.r < H + 40);
    if (state === 'play') save.stats.dodged += before - rocks.length;
    for (const s of stars) { s.y += s.vy * dt; s.a += dt * 3; }
    stars = stars.filter((s) => s.y - s.r < H + 40);

    if (state === 'play') {

      }
      for (const s of stars) {
        if (!s.got && Math.hypot(s.x - player.x, s.y - player.y) < s.r + player.r) {
          s.got = true; bonus += 50; runStars++; natStars++; save.stars++; save.stats.totalStars++;
          walletEl.textContent = save.stars;
          Sound.play('star');
          for (let i = 0; i < 12; i++) {
            const a = rand(0, Math.PI * 2), sp = rand(40, 160) * unit;
            sparks.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5, max: 0.5, c: C.ink });
          }
          try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
        }
      }
      stars = stars.filter((s) => !s.got);
      score = Math.floor(t * 10) + bonus;
      scoreEl.textContent = score;
      achT -= dt;
      if (achT <= 0 && state === 'play') { checkAch({ time: t, score, stars: runStars, boss: bossCleared }); achT = 0.5; }
    }

    trail = stepTrail(trail, dt);
    for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
    sparks = sparks.filter((p) => p.life > 0);

    if (state === 'dying') { dyingT -= dt; if (dyingT <= 0) finishRun(false); }
  }

  // ================= draw =================
  function draw() {
    drawBg(ctx, W, H, save.equip.bg, clock, dots);

    if (boss && boss.phase === 'warn' && (reduceMotion || Math.floor(clock * 4) % 2 === 0)) {
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.3);
      g.addColorStop(0, rgba(C.boss, 0.35)); g.addColorStop(1, rgba(C.boss, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.3);
    }

    for (const s of stars) {
      const pulse = reduceMotion ? 1 : 1 + Math.sin(s.a * 2) * 0.12;
      ctx.save();
      ctx.shadowColor = C.ink; ctx.shadowBlur = 14; ctx.fillStyle = C.ink;
      starPath(ctx, s.x, s.y, s.r * pulse, s.a * 0.4); ctx.fill();
      ctx.restore();
    }

    for (const m of rocks) {
      const vx = m.type === 'zigzag' ? Math.cos(m.phase) * m.amp * 3 : m.vx;
      const sp = Math.hypot(vx, m.vy), len = m.r * 4.5;
      const nx = -vx / sp, ny = -m.vy / sp;
      const tail = ctx.createLinearGradient(m.x, m.y, m.x + nx * len, m.y + ny * len);
      tail.addColorStop(0, rgba(m.color, 0.55)); tail.addColorStop(1, rgba(m.color, 0));
      ctx.strokeStyle = tail; ctx.lineWidth = m.r * 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + nx * len, m.y + ny * len); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(8,15,39,0.28)';
      ctx.beginPath(); ctx.arc(m.x + Math.cos(m.spin) * m.r * 0.35, m.y + Math.sin(m.spin) * m.r * 0.35, m.r * 0.28, 0, Math.PI * 2); ctx.fill();
    }

    drawTrail(ctx, trail);
    if (state !== 'dying' && state !== 'over') drawHero(ctx, player.x, player.y, player.r, save.equip, clock);

    for (const p of sparks) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6 * unit, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (banner.t > 0 && (state === 'play' || state === 'countdown')) {
      ctx.globalAlpha = clamp(banner.t, 0, 1);
      ctx.fillStyle = banner.color;
      ctx.font = `${Math.round(30 * unit)}px Jua, "Apple SD Gothic Neo", sans-serif`;
      ctx.fillText(banner.text, W / 2, H * 0.36);
      ctx.globalAlpha = 1;
    }
    if (state === 'countdown') {
      ctx.fillStyle = C.ink;
      ctx.font = `${Math.round(84 * unit)}px Jua, "Apple SD Gothic Neo", sans-serif`;
      ctx.fillText(String(Math.ceil(countdown)), W / 2, H * 0.5);
    }
  }

  // ================= shop =================
  const pv = $('preview'), pctx = pv.getContext('2d');
  let pW = 0, pH = 0, pTrail = [], pTrailT = 0, pDots = [];
  let tab = 'skin', picked = null;
  const previewLook = () => ({ ...save.equip, ...(picked ? { [tab]: picked } : {}) });

  const tabsEl = $('tabs');
  for (const [id, label] of TABS) {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.tab = id; b.textContent = label;
    b.addEventListener('click', () => { tab = id; picked = null; $('toast').textContent = ''; renderShop(); });
    tabsEl.appendChild(b);
  }

  function sizePreview() {
    const r = pv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    pW = r.width; pH = r.height;
    pv.width = Math.round(pW * dpr); pv.height = Math.round(pH * dpr);
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pDots = makeDots(pW, pH, 40);
  }

  function drawPreview(dt) {
    if (screens.shop.hidden || overlay.hidden || !pW) return;
    const look = previewLook();
    const r = 24, x = pW / 2 + (reduceMotion ? 0 : Math.sin(clock * 1.6) * 40), y = pH * 0.58;
    pTrailT -= dt;
    if (pTrailT <= 0) { emitTrail(pTrail, look.trail, x, y, r, 0.8, clock); pTrailT = 1 / 40; }
    pTrail = stepTrail(pTrail, dt);
    stepDots(pDots, dt, pW, pH, look.bg);
    pctx.save();
    pctx.beginPath(); pctx.roundRect ? pctx.roundRect(0, 0, pW, pH, 16) : pctx.rect(0, 0, pW, pH); pctx.clip();
    drawBg(pctx, pW, pH, look.bg, clock, pDots);
    drawTrail(pctx, pTrail);
    drawHero(pctx, x, y, r, look, clock);
    pctx.restore();
  }

  function itemIcon(cat, item) {
    const c = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = c.height = 46 * dpr;
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cat === 'trail') {
      if (item.id !== 'none') {
        const list = [];
        for (let i = 0; i < 7; i++) {
          const k = i / 6;
          list.push({ kind: item.id, x: 23 + Math.sin(i * 1.3) * 8, y: 10 + k * 30, s: 14, life: 1 - k * 0.7, max: 1, hue: i * 50 });
        }
        drawTrail(g, list);
      } else {
        g.strokeStyle = 'rgba(163,173,208,0.6)'; g.lineWidth = 2;
        g.beginPath(); g.arc(23, 23, 12, 0, Math.PI * 2); g.moveTo(15, 31); g.lineTo(31, 15); g.stroke();
      }
    } else if (cat === 'bg') {
      g.beginPath(); g.roundRect ? g.roundRect(1, 1, 44, 44, 10) : g.rect(1, 1, 44, 44); g.clip();
      drawBg(g, 46, 46, item.id, 1.2, makeDots(46, 46, 8));
    } else {
      const look = { ...save.equip, hat: 'none', face: 'basic', [cat]: item.id };
      const hat = cat === 'hat';
      drawHero(g, 23, hat ? 30 : 23, hat ? 12 : 15, look, 0);
    }
    return c;
  }

  function renderShop() {
    $('purse').textContent = save.stars;
    for (const b of tabsEl.children) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    const box = $('items');
    box.textContent = '';
    for (const it of ITEMS[tab]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'item';
      b.setAttribute('aria-pressed', String(it.id === (picked || save.equip[tab])));
      b.appendChild(itemIcon(tab, it));
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.name; b.appendChild(nm);
      const st = document.createElement('span'); st.className = 'st';
      if (save.equip[tab] === it.id) { st.textContent = '장착중'; st.classList.add('on'); }
      else if (owns(tab, it.id)) st.textContent = '보유';
      else { st.textContent = '★ ' + it.price; st.classList.add('price'); }
      b.appendChild(st);
      b.addEventListener('click', () => { picked = it.id; $('toast').textContent = ''; renderShop(); });
      box.appendChild(b);
    }
    const id = picked || save.equip[tab], it = findItem(tab, id), act = $('actBtn');
    if (save.equip[tab] === id) { act.textContent = '장착중'; act.disabled = true; }
    else if (owns(tab, id)) { act.textContent = '장착하기'; act.disabled = false; }
    else if (save.stars >= it.price) { act.textContent = `★${it.price}로 사기`; act.disabled = false; }
    else { act.textContent = `별이 ${it.price - save.stars}개 더 필요해요`; act.disabled = true; }
  }

  $('actBtn').addEventListener('click', () => {
    const id = picked || save.equip[tab], it = findItem(tab, id);
    if (!owns(tab, id)) {
      if (save.stars < it.price) return;
      save.stars -= it.price; save.owned.push(tab + ':' + id); save.stats.buys++;
      $('toast').textContent = `${it.name}을(를) 샀어요!`;
      Sound.play('buy');
      try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
      checkAch(idleRun());
    } else {
      $('toast').textContent = `${it.name} 장착!`;
    }
    save.equip[tab] = id; picked = null;
    persist(); refreshHud(); renderShop();
  });

  function openShop() {
    picked = null; pTrail = []; $('toast').textContent = '';
    renderShop();
    requestAnimationFrame(sizePreview);
  }

  // ================= loop =================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    drawPreview(dt);
    requestAnimationFrame(frame);
  }

  refreshHud(); renderToggles();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
